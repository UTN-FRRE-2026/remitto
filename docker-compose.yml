# =============================================================
#  Remitto – Infraestructura de desarrollo
#  Levanta PostgreSQL (persistencia del schema Prisma) y Adminer
#  (cliente web para inspeccionar la base).
#
#  Uso:
#    docker compose up -d          # levanta la base
#    cd backend && npx prisma migrate dev   # crea las tablas
#
#  El backend se ejecuta fuera de Docker en desarrollo (npm run dev)
#  para aprovechar el hot-reload. En producción se agrega como
#  servicio adicional (ver RNF6 del plan).
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: remitto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remitto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remitto}
      POSTGRES_DB: ${POSTGRES_DB:-remitto}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - remitto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remitto} -d ${POSTGRES_DB:-remitto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: remitto_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  # Backend en contenedor (opcional, perfil "app"). No se levanta con
  # `docker compose up -d`; se usa para probar la imagen de la API:
  #   docker compose --profile app up -d --build backend
  # Al arrancar aplica las migraciones pendientes (`prisma migrate deploy`).
  # Toma JWT_SECRET y el resto de backend/.env; la URL de la base apunta
  # al servicio db de la red interna. Si el backend local (npm run dev)
  # está corriendo en :4000, levantarlo con BACKEND_PORT=4001.
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: remitto_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-remitto}:${POSTGRES_PASSWORD:-remitto}@db:5432/${POSTGRES_DB:-remitto}?schema=public
      PORT: 4000
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      # HU8: bind mount a backend/uploads del host. El backend local y el
      # contenedor comparten la base, así que también comparten los archivos
      # de comprobantes; además persisten aunque se recree el contenedor.
      # UPLOADS_HOST_DIR permite apuntar a otra carpeta del host.
      - ${UPLOADS_HOST_DIR:-./backend/uploads}:/app/uploads

volumes:
  remitto_pgdata:
