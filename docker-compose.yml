# =============================================================
#  Remitto – Infraestructura de desarrollo
#  Levanta PostgreSQL (persistencia del schema Prisma) y Adminer
#  (cliente web para inspeccionar la base).
#
#  Uso:
#    docker compose up -d          # levanta la base
#    cd backend && npx prisma migrate dev   # crea las tablas
#
#  El backend se ejecuta fuera de Docker en desarrollo (npm run dev)
#  para aprovechar el hot-reload. En producción se agrega como
#  servicio adicional (ver RNF6 del plan).
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: remitto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remitto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remitto}
      POSTGRES_DB: ${POSTGRES_DB:-remitto}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - remitto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remitto} -d ${POSTGRES_DB:-remitto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: remitto_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  remitto_pgdata:
