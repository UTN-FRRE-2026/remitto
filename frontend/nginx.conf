# =============================================================
#  nginx del frontend Remitto (producción).
#  - Sirve la PWA compilada.
#  - Reenvía /api al servicio "backend" de docker-compose.prod.yml.
#  El HTTPS lo pone Coolify (Traefik) por delante.
# =============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HU8: comprobantes de hasta ARCHIVO_MAX_MB (10 MB) más el resto del
    # formulario. nginx acepta 1 MB por defecto. Si se sube ARCHIVO_MAX_MB,
    # subir también este valor.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # DNS interno de Docker. Con la dirección en una variable, nginx resuelve
    # "backend" en cada pedido: arranca aunque el backend todavía no esté
    # listo y sigue funcionando cuando el contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:4000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HU7: el service worker y el manifiesto no se guardan en caché, así la
    # PWA detecta enseguida una versión nueva (registerType: 'autoUpdate').
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx no conoce la extensión .webmanifest y la serviría como binario.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Rutas de React Router (/productos, /comprobantes/:id/...): al recargar
    # la página se devuelve index.html en lugar de un 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
